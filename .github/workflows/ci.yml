# Integracion continua (C04). Corre en cada push a main y en cada pull request.
# Tres trabajos: API (pruebas unitarias + integracion con PostgreSQL), cliente (build + pruebas) y stack (imagenes + verify-module.sh M14).
# El Sonar NO corre aqui: es un SonarQube local (se analiza a mano y la evidencia queda en docs/).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tcsw-ventas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: PostgreSQL (el mismo docker compose del proyecto, con una clave de CI sin valor)
        run: |
          cp .env.example .env
          docker compose up -d --wait
      - name: Pruebas unitarias + integracion y artefacto ejecutable
        run: |
          set -a; . ./.env; set +a
          mvn -B clean verify -Pintegracion spring-boot:repackage
      - name: Resumen de pruebas
        if: always()
        run: ./scripts/resumen-pruebas.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-reportes-y-jar
          path: |
            tcsw-ventas/target/surefire-reports
            tcsw-ventas/target/failsafe-reports
            tcsw-ventas/target/tcsw-ventas-1.0.0.jar
          if-no-files-found: warn

  cliente:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cliente-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cliente-angular/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
      - run: npx ng test --watch=false
      - uses: actions/upload-artifact@v4
        with:
          name: cliente-dist
          path: cliente-angular/dist
          if-no-files-found: warn

  stack:
    needs: [api, cliente]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tcsw-ventas
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Construir imagenes, levantar el stack y verificar
        run: ./scripts/verify-module.sh M14
      - name: Logs si fallo
        if: failure()
        run: docker compose --profile stack logs --no-color | tail -150
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-stack-salida
          path: tcsw-ventas/docs/evidencia/verify-stack-salida.txt
          if-no-files-found: warn
