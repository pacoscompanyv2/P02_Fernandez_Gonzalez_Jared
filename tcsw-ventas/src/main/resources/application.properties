# P09 API de ventas. Nada de claves aqui: la base se configura con las variables de entorno TCSW_* (ver README).
spring.application.name=tcsw-ventas-api
spring.main.banner-mode=off
# solo escucha en tu maquina; cambia el puerto con  SERVER_PORT=9090
server.address=127.0.0.1
server.port=8080
# nunca se devuelven mensajes ni trazas internas de Spring: los errores salen de ManejadorErrores
server.error.include-message=never
server.error.include-stacktrace=never
