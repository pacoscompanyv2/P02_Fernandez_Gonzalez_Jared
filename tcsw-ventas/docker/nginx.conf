server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # la API (servicio "api" del compose). Si la API esta caida, nginx responde 502 y el cliente lo muestra como SIN_CONEXION.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
